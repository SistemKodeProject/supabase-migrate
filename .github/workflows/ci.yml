name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Byte-compile all scripts
        run: python -m py_compile *.py
      - name: Lint with ruff
        run: ruff check .
      - name: Smoke-test the CLI wrapper
        run: |
          python migrate.py --help
          python 1_dump_database.py --help
          python 2_restore_database.py --help
          python 4_restore_storage.py --help
          python 6_download_storage.py --help
          python push_local_backup.py --help
      - name: Secret scan (fail if anything that looks like a real key is committed)
        run: |
          ! grep -rEn 'sbp_[a-f0-9]{40}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{30,}|AKIA[0-9A-Z]{16}' --exclude-dir=.git .
